name: Update GA4 Today Visitors

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ga-visitors
  cancel-in-progress: true

jobs:
  update-visitors:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch GA4 today visitors
        env:
          GA_PROPERTY_ID: '566039398'
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
        run: node tools/update-ga-visitors.js

      - name: Commit and trigger Pages deploy if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet source/_data/visitors.json; then
            echo "No visitor count changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/_data/visitors.json
          git commit -m "chore: GA4 오늘 방문자 수 갱신"
          git push
          gh workflow run pages.yml
